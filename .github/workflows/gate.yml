name: gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mechanical gate
        run: python3 scripts/gate.py --base "origin/${{ github.base_ref }}"
      - name: Gate self-test
        run: |
          # The gate's own four-case test: a change that weakens gate.py must redden CI
          # even when the weakened gate itself still waves this PR through.
          # actions/checkout leaves a detached HEAD on pull_request events, and
          # test_loop anchors its throwaway worktrees on the checked-out branch name:
          # with BASE=HEAD, case 3 diffs HEAD against itself and can never go red.
          # Pin a stable ref first. (Verified locally: detached HEAD fails case 3,
          # an anchored branch passes all four.)
          git checkout -b ci-gate-anchor
          # test_loop parks its throwaway worktrees under ~/.hermes/cache/scratch.
          mkdir -p ~/.hermes/cache/scratch
          python3 scripts/test_loop.py
